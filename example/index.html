<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pagination demo</title>
  <link rel="stylesheet" href="../dist/styles.css" />
  <style>
    body { font-family: system-ui, sans-serif; padding: 32px; display: grid; gap: 24px; }
    h3 { margin: 0 0 8px; font-size: 14px; color: #6b7280; font-weight: 500; }
  </style>
  <script type="importmap">
    { "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
    } }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import React, { useState } from 'react';
    import { createRoot } from 'react-dom/client';
    import { Pagination, usePagination } from '../dist/index.js';
    const h = React.createElement;

    function Section(title, child) {
      return h('section', null, h('h3', null, title), child);
    }

    function App() {
      const [page, setPage] = useState(5);
      const headless = usePagination({ totalPages: 8 });
      return h('div', { style: { display: 'grid', gap: 24 } },
        Section(`Controlled (page ${page})`, h(Pagination, { totalPages: 20, page, onChange: setPage, showFirstButton: true, showLastButton: true })),
        Section('Filled + circular + lg', h(Pagination, { totalPages: 12, defaultPage: 6, variant: 'filled', shape: 'circular', size: 'lg' })),
        Section('Text + sm, siblingCount=2', h(Pagination, { totalItems: 450, pageSize: 10, defaultPage: 20, variant: 'text', size: 'sm', siblingCount: 2 })),
        Section('Disabled', h(Pagination, { totalPages: 10, disabled: true })),
        Section('Dark theme', h('div', { style: { background: '#111827', padding: 12, borderRadius: 8 } },
          h(Pagination, { totalPages: 10, defaultPage: 3, 'data-theme': 'dark' }))),
        Section('Headless hook', h('div', { style: { display: 'flex', gap: 6 } },
          headless.items.map((it, i) => h('button', { key: i, onClick: it.onClick, disabled: it.disabled,
            style: { fontWeight: it.selected ? 700 : 400 } }, it.type === 'page' ? it.page : it.type)))),
      );
    }
    createRoot(document.getElementById('root')).render(h(App));
  </script>
</body>
</html>
